services:
  # 1. Shared MySQL Container
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    command: 
      - --innodb_redo_log_capacity=2147483648  # Increases Redo Log to 2GB (Default is 100MB)
      - --innodb_flush_log_at_trx_commit=2     # Flushes log once per sec instead of per commit (huge bulk-import speedup)
      - --sync_binlog=0                        # Disables OS disk syncing on binary log during writes 
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 10

  # 2. C++ Ingestion Worker (Needs Read-Write / Admin)
  data-loader:
    build:
      context: ./data-loader
      dockerfile: Dockerfile
    environment:
      DOWNLOAD_OSF_DATA: "false"
      TM_DB_USER: travmapadmin
      TM_DB_PASS: travmapadmin_password
    volumes:
      - ./repos/DataProcessing:/app/DataProcessing
      - ./repos/HighwayData:/app/HighwayData
      - ./repos/UserData:/app/UserData
      - ./repos/RailwayData:/app/RailwayData
      - ./osf_data:/app/osf_data
      - ./repos/Web:/web/highways
      - ./repos/Web:/web/rail
    depends_on:
      db:
        condition: service_healthy

  # 3. TMHighways Server (Read-Only)
  tmhighways:
    image: php:8.2-apache
    ports:
      - "8080:80"
    environment:
      TM_DB_NAME: TravelMapping
      TM_DB_HOST: db
      TM_DB_USER: travmap
      TM_DB_PASS: travmap_password
    volumes:
      - ./repos/Web:/var/www/html
    depends_on:
      data-loader:
        condition: service_completed_successfully

  # 4. TMRail Server (Read-Only)
  tmrail:
    image: php:8.2-apache
    ports:
      - "8081:80"
    environment:
      TM_DB_NAME: TravelMappingRail
      TM_DB_HOST: db
      TM_DB_USER: travmap
      TM_DB_PASS: travmap_password
    volumes:
      - ./repos/Web:/var/www/html
    depends_on:
      data-loader:
        condition: service_completed_successfully

  # 5. HDX Server (Read-Only)
  hdx:
    image: php:8.2-apache
    ports:
      - "8082:80"
    environment:
      TM_DB_NAME: TravelMapping
      TM_DB_HOST: db
      TM_DB_USER: travmap
      TM_DB_PASS: travmap_password
    volumes:
      - ./repos/Web:/var/www/html/web
      - ./repos/EduTools:/var/www/html/edutools
    depends_on:
      data-loader:
        condition: service_completed_successfully

volumes:
  mysql_data:

